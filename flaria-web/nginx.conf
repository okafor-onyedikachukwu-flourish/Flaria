map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream flaria_core {
    server core:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 256k;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://flaria_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /health/ {
        proxy_pass http://flaria_core;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://flaria_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /mediapipe/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public landing page: prerendered HTML (scripts/prerender.mjs), the only indexable URL.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # One canonical URL for the landing page.
    location = /index.html {
        return 301 /;
    }

    # Crawler files and brand images.
    location ~ ^/(robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.svg|favicon-48\.png|apple-touch-icon\.png|icon-(192|512)\.png|og-image\.png)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Every app route (sign-in, dashboard, admin, account, reset links) gets the empty
    # shell and is kept out of search results: these pages are private or user-specific.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri /app.html;
    }
}
