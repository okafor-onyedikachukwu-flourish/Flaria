# Included in every location that sets headers (nginx drops server-level add_header
# directives in any location that declares its own).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://commons.wikimedia.org https://upload.wikimedia.org https://images.unsplash.com; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Enable once TLS terminates in front of this container:
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
